name: Build Performance HUB V4

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fabric mod
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle is provisioned below; don't enable setup-java's Gradle cache here because
      # this repository intentionally does not include gradlew/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Verify toolchain
        shell: pwsh
        run: |
          java -version
          gradle --version
          Write-Host "Repository root: $PWD"
          if (!(Test-Path 'build.gradle')) { throw 'build.gradle was not found in the repository root. Commit the contents of the perfhub folder, not its parent folder.' }
          if (!(Test-Path 'gradle.properties')) { throw 'gradle.properties was not found in the repository root.' }
          if (!(Test-Path 'src/main/java')) { throw 'src/main/java was not found. Upload the project contents, not an extra parent folder.' }

      - name: Build mod
        shell: pwsh
        run: gradle clean build --no-daemon --stacktrace

      - name: List build outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'build/libs') {
            Get-ChildItem 'build/libs' | Format-Table Name, Length
          } else {
            Write-Host 'build/libs does not exist; check the build logs above.'
          }

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Performance-HUB-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
